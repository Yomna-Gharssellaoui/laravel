name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:

jobs:
  tests:
    name: Tests & qualité (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, zip, fileinfo, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests (PHPUnit)
        run: php artisan test

      - name: Security audit
        run: composer audit

  mysql:
    name: Tests sur MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: trace_verte_test
          MYSQL_USER: trace_verte
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: trace_verte_test
      DB_USERNAME: trace_verte
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Migrations and demo dataset
        run: php artisan migrate:fresh --seed --force
      # The DB_* variables above take precedence over the in-memory SQLite of phpunit.xml
      - name: Tests (PHPUnit on MySQL)
        run: vendor/bin/phpunit

  frontend:
    name: Build front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  ml:
    name: Modèles ML (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Train the 6 module models
        run: python train_all.py
      - name: Quality gates and API tests (pytest)
        run: python -m pytest -q

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [tests, mysql, frontend, ml]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Docker image names must be lower-case (the GitHub owner name is not)
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trace-verte" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML service image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ml
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}-ml:latest,${{ steps.image.outputs.name }}-ml:${{ github.sha }}
