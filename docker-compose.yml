# Local stack: app + queue worker + scheduler + ML service + MySQL + Mailpit
#   docker compose up -d --build
#   App:     http://localhost:8000   (admin@traceverte.test / password)
#   Emails:  http://localhost:8025   (Mailpit catches every email sent)
#   ML:      http://localhost:8001/docs (scikit-learn models, trained at build time)

x-app: &app
  build: .
  image: trace-verte:latest
  env_file: .env
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://localhost:8000
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: trace_verte
    DB_USERNAME: trace_verte
    DB_PASSWORD: secret
    QUEUE_CONNECTION: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    ML_SERVICE_URL: http://ml:8001
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "8000:80"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "${SEED_DATABASE:-true}"

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  ml:
    build: ./ml
    image: trace-verte-ml:latest
    ports:
      - "8001:8001"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trace_verte
      MYSQL_USER: trace_verte
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-utrace_verte"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  mysql:
  storage:
