sonar.projectKey=trace-verte
sonar.projectName=Trace Verte
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Sources Laravel et Python
sonar.sources=app,routes,config,database,ml

# Tests Laravel
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php

# Exclusions
sonar.exclusions=\
vendor/**,\
node_modules/**,\
storage/**,\
bootstrap/cache/**,\
ml/tests/**,\
ml/__pycache__/**,\
ml/.venv/**,\
**/*.min.js

# Rapport de couverture PHPUnit
sonar.php.coverage.reportPaths=build/coverage/clover.xml
